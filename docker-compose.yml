services:
  postgres:
    image: postgres:16
    container_name: culinarium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: culinarium
      POSTGRES_USER: culinarium
      POSTGRES_PASSWORD: culinarium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: culinarium-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
